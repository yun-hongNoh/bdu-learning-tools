<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가중순위 의사결정 시뮬레이터 | 12주차</title>
<style>
/* ============================================================
   DESIGN TOKENS (1·2차 시뮬레이터에서 검증된 시스템 재사용)
   ============================================================ */
:root{
  --bg-deep:#040b18;
  --bg-mid:#08182c;
  --bg-panel:rgba(13,34,57,.78);
  --bg-card:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.13);
  --line-strong:rgba(255,255,255,.22);

  --text:#eef6ff;
  --text-muted:#9fb3cc;
  --text-dim:#6a8099;

  --scan-cyan:#4be7ca;
  --scan-glow:rgba(75,231,202,.55);
  --good-blue:#5ec3ff;
  --good-glow:rgba(94,195,255,.55);
  --bad-red:#ff6b8e;
  --bad-glow:rgba(255,107,142,.55);
  --warn-yellow:#ffd166;
  --warn-glow:rgba(255,209,102,.65);
  --gold:#ffb946;
  --principle:#ffd166;
  --principle-glow:rgba(255,209,102,.55);
  --split-purple:#b794f6;
  --split-glow:rgba(183,148,246,.55);
  --solve-green:#7ee787;
  --solve-glow:rgba(126,231,135,.55);

  --grad-tech:linear-gradient(135deg,#5ec3ff,#2c6fb4);
  --grad-action:linear-gradient(135deg,#4be7ca,#2c9ee0);
  --grad-principle:linear-gradient(135deg,#ffd166,#ffb946);
  --grad-solve:linear-gradient(135deg,#7ee787,#4be7ca);
  --grad-danger:linear-gradient(135deg,#ff6b8e,#a23656);

  --shadow-soft:0 18px 44px rgba(0,0,0,.45);
  --shadow-hard:0 28px 68px rgba(0,0,0,.55);

  --radius-s:14px;
  --radius-m:20px;
  --radius-l:28px;
  --radius-pill:999px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 8%, rgba(75,231,202,.18), transparent 28%),
    radial-gradient(circle at 88% 4%, rgba(94,195,255,.15), transparent 32%),
    radial-gradient(circle at 50% 100%, rgba(183,148,246,.12), transparent 40%),
    linear-gradient(135deg,#040b18,#0a1c31 55%,#061323);
  min-height:100vh;
  font-weight:500;
  letter-spacing:-.01em;
}

body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(75,231,202,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(75,231,202,.04) 1px, transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
}

button{font-family:inherit;color:inherit}

/* ============================================================
   SCREEN MANAGEMENT (1차에서 검증된 우선순위 충돌 회피)
   ============================================================ */
.screen{width:100%}
.screen:not(.active){display:none !important}
.screen.active{animation:screenIn .5s cubic-bezier(.2,.7,.3,1.2)}
@keyframes screenIn{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ============================================================
   INTRO SCREEN
   ============================================================ */
#intro{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  position:relative;
  z-index:1;
}
.intro-wrap{
  max-width:1080px;
  width:100%;
  text-align:center;
}
.intro-eyebrow{
  display:inline-block;
  padding:8px 16px;
  border-radius:var(--radius-pill);
  background:rgba(75,231,202,.10);
  border:1px solid rgba(75,231,202,.34);
  color:var(--scan-cyan);
  font-weight:800;
  font-size:13px;
  letter-spacing:.18em;
  margin-bottom:24px;
  animation:pulseBadge 2.4s ease-in-out infinite;
}
@keyframes pulseBadge{
  0%,100%{box-shadow:0 0 0 0 rgba(75,231,202,.4)}
  50%{box-shadow:0 0 0 14px rgba(75,231,202,0)}
}
.intro-title{
  margin:0 0 16px;
  font-size:clamp(34px,5.5vw,64px);
  font-weight:1000;
  line-height:1.05;
  letter-spacing:-.05em;
  background:linear-gradient(135deg,#fff 0%,#a8e6ff 45%,#4be7ca 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  filter:drop-shadow(0 4px 24px rgba(75,231,202,.18));
}
.intro-sub{
  margin:0 0 36px;
  font-size:clamp(15px,1.7vw,19px);
  color:var(--text-muted);
  font-weight:600;
  line-height:1.55;
  max-width:720px;
  margin-left:auto;margin-right:auto;
}
.intro-sub b{color:var(--warn-yellow);font-weight:900}

/* 5-step preview pipeline */
.pipe-preview{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  max-width:880px;
  margin:0 auto 40px;
}
.pipe-node{
  padding:14px 8px;
  border-radius:var(--radius-m);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  text-align:center;
  position:relative;
}
.pipe-node .pn-num{
  display:inline-block;
  width:26px;height:26px;
  border-radius:50%;
  background:rgba(75,231,202,.18);
  border:1px solid rgba(75,231,202,.42);
  color:var(--scan-cyan);
  font-size:12px;
  font-weight:1000;
  line-height:24px;
  margin-bottom:6px;
}
.pipe-node .pn-name{
  font-size:11px;
  font-weight:900;
  letter-spacing:-.02em;
  line-height:1.2;
  color:var(--text);
}
.pipe-node::after{
  content:"→";
  position:absolute;
  right:-9px;
  top:50%;
  transform:translateY(-50%);
  color:var(--scan-cyan);
  font-weight:1000;
  z-index:2;
  font-size:14px;
}
.pipe-node:last-child::after{display:none}

/* Case selection cards */
.case-select-title{
  margin:0 0 16px;
  font-size:15px;
  font-weight:900;
  color:var(--text-muted);
  letter-spacing:.06em;
}
.case-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:1040px;
  margin:0 auto;
}
.case-card{
  padding:24px 20px;
  border-radius:var(--radius-l);
  background:var(--bg-card);
  border:1px solid var(--line);
  cursor:pointer;
  text-align:left;
  transition:all .25s cubic-bezier(.2,.7,.3,1.2);
  position:relative;
  overflow:hidden;
  color:inherit;
}
.case-card::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 50%,rgba(75,231,202,.10));
  opacity:0;
  transition:.3s;
}
.case-card:hover{
  transform:translateY(-5px);
  border-color:var(--scan-cyan);
  box-shadow:0 22px 44px rgba(75,231,202,.18);
}
.case-card:hover::before{opacity:1}
.case-card .cc-num{
  display:inline-block;
  padding:3px 10px;
  border-radius:var(--radius-pill);
  font-size:11px;
  font-weight:1000;
  background:rgba(255,209,102,.14);
  color:var(--warn-yellow);
  letter-spacing:.06em;
  margin-bottom:10px;
}
.case-card .cc-icon{
  font-size:40px;
  margin-bottom:10px;
  filter:drop-shadow(0 0 12px rgba(75,231,202,.4));
}
.case-card .cc-title{
  font-size:19px;
  font-weight:1000;
  letter-spacing:-.03em;
  margin-bottom:8px;
}
.case-card .cc-sub{
  font-size:13px;
  color:var(--text-muted);
  font-weight:700;
  line-height:1.45;
  margin-bottom:12px;
}
.case-card .cc-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.case-card .cc-tag{
  font-size:11px;
  padding:3px 8px;
  border-radius:var(--radius-pill);
  background:rgba(94,195,255,.12);
  color:var(--good-blue);
  font-weight:700;
}
.intro-footer{
  margin-top:36px;
  color:var(--text-dim);
  font-size:13px;
}

/* ============================================================
   MAIN SIM SCREEN
   ============================================================ */
#sim{
  padding:18px;
  min-height:100vh;
  position:relative;
  z-index:1;
}
.app{
  max-width:1320px;
  margin:0 auto;
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  gap:14px;
  min-height:calc(100vh - 36px);
}

/* Top bar: brand + step pipe + case picker */
.top-bar{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:18px;
  align-items:center;
  padding:14px 20px;
  border-radius:var(--radius-l);
  background:var(--bg-panel);
  border:1px solid var(--line);
  backdrop-filter:blur(14px);
  box-shadow:var(--shadow-soft);
  position:relative;
  z-index:50;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:1000;
  font-size:17px;
  letter-spacing:-.03em;
}
.brand-dot{
  width:11px;height:11px;border-radius:50%;
  background:var(--scan-cyan);
  box-shadow:0 0 14px var(--scan-cyan);
  animation:dotPulse 1.6s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 14px var(--scan-cyan)}
  50%{transform:scale(1.3);box-shadow:0 0 24px var(--scan-cyan)}
}
.brand-text{background:linear-gradient(135deg,#fff,#a8e6ff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Step pipe (5 steps) */
.step-pipe{
  display:flex;
  align-items:center;
  gap:6px;
  flex:1;
  justify-content:center;
}
.sp-node{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-radius:var(--radius-pill);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  font-size:12px;
  font-weight:900;
  color:var(--text-muted);
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}
.sp-node:hover{background:rgba(255,255,255,.08);color:var(--text)}
.sp-node .sp-num{
  width:20px;height:20px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  display:grid;place-items:center;
  font-size:11px;
  font-weight:1000;
  color:var(--text-muted);
  transition:.2s;
}
.sp-node.done{
  background:rgba(126,231,135,.10);
  border-color:rgba(126,231,135,.36);
  color:var(--solve-green);
}
.sp-node.done .sp-num{background:var(--solve-green);color:#04222d}
.sp-node.active{
  background:linear-gradient(135deg,rgba(75,231,202,.22),rgba(94,195,255,.18));
  border-color:var(--scan-cyan);
  color:var(--text);
  box-shadow:0 6px 18px rgba(75,231,202,.22);
}
.sp-node.active .sp-num{
  background:var(--scan-cyan);
  color:#04222d;
  animation:dotPulse 1.4s ease-in-out infinite;
}

.case-picker{
  position:relative;
  z-index:60;
}
.case-pick-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  border-radius:var(--radius-pill);
  background:rgba(255,209,102,.10);
  border:1px solid rgba(255,209,102,.36);
  color:var(--warn-yellow);
  font-weight:1000;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}
.case-pick-btn:hover{background:rgba(255,209,102,.16)}
.case-pick-btn::after{content:"▾";font-size:10px;margin-left:2px}
.case-menu{
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  min-width:240px;
  padding:8px;
  border-radius:var(--radius-m);
  background:#0b1f33;
  border:1px solid var(--line-strong);
  box-shadow:var(--shadow-hard);
  z-index:200;
  display:none;
}
.case-menu.show{display:block;animation:menuIn .2s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.case-menu .cm-item{
  display:block;width:100%;
  padding:10px 12px;
  border:none;border-radius:12px;
  background:transparent;color:var(--text);
  text-align:left;cursor:pointer;
  font-size:13px;font-weight:800;
  transition:.15s;
}
.case-menu .cm-item:hover{background:rgba(255,255,255,.06)}
.case-menu .cm-item.active{background:rgba(75,231,202,.12);color:var(--scan-cyan)}
.case-menu .cm-item small{display:block;color:var(--text-dim);font-size:11px;font-weight:700;margin-top:2px}

/* Question banner */
.q-banner{
  padding:14px 22px;
  border-radius:var(--radius-l);
  background:var(--bg-panel);
  border:1px solid var(--line);
  backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  gap:14px;
}
.q-tag{
  padding:6px 12px;
  border-radius:var(--radius-pill);
  background:rgba(75,231,202,.14);
  border:1px solid rgba(75,231,202,.42);
  color:var(--scan-cyan);
  font-size:11px;
  font-weight:1000;
  letter-spacing:.1em;
  white-space:nowrap;
}
.q-text{
  flex:1;
  margin:0;
  font-size:clamp(17px,2vw,22px);
  font-weight:1000;
  letter-spacing:-.03em;
}
.q-constraint{
  padding:7px 13px;
  border-radius:var(--radius-pill);
  background:rgba(255,209,102,.10);
  border:1px solid rgba(255,209,102,.32);
  font-size:12px;
  font-weight:800;
  color:var(--warn-yellow);
  white-space:nowrap;
}

/* Main body: stage + side panel */
.main-body{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(360px,1fr);
  gap:14px;
}
.scene{
  position:relative;
  border-radius:var(--radius-l);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),#061425;
  border:1px solid var(--line);
  overflow:hidden;
  min-height:560px;
  box-shadow:var(--shadow-soft);
}
.scene::before,.scene::after{
  content:"";
  position:absolute;
  width:34px;height:34px;
  border:2px solid var(--scan-cyan);
  pointer-events:none;
  z-index:5;
}
.scene::before{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.scene::after{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.scene-corner-tr,.scene-corner-bl{
  position:absolute;
  width:34px;height:34px;
  border:2px solid var(--scan-cyan);
  pointer-events:none;
  z-index:5;
}
.scene-corner-tr{top:14px;right:14px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.scene-corner-bl{bottom:14px;left:14px;border-right:none;border-top:none;border-radius:0 0 0 8px}

.scene-label{
  position:absolute;
  top:18px;left:54px;
  font-size:11px;font-weight:900;
  color:var(--scan-cyan);
  letter-spacing:.16em;
  z-index:6;
  text-transform:uppercase;
}
.scene-label::before{
  content:"●";margin-right:8px;
  animation:dotPulse 1.4s ease-in-out infinite;
  display:inline-block;
}
.scene-step-tag{
  position:absolute;
  top:18px;right:54px;
  padding:4px 10px;
  border-radius:var(--radius-pill);
  background:rgba(75,231,202,.12);
  border:1px solid rgba(75,231,202,.36);
  color:var(--scan-cyan);
  font-size:11px;font-weight:1000;
  letter-spacing:.06em;
  z-index:6;
}
.stage{
  position:absolute;
  inset:60px 30px 76px 30px;
  overflow-y:auto;
  padding:6px 4px;
}
.stage::-webkit-scrollbar{width:6px}
.stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.scene-caption{
  position:absolute;
  left:50%;bottom:18px;
  transform:translateX(-50%);
  width:min(720px,calc(100% - 80px));
  padding:11px 18px;
  border-radius:var(--radius-pill);
  background:rgba(5,16,29,.78);
  border:1px solid var(--line-strong);
  text-align:center;
  font-size:13px;font-weight:800;
  z-index:7;
  color:var(--text-muted);
}
.scene-caption b{color:var(--warn-yellow)}
.scene-caption .good{color:var(--solve-green)}
.scene-caption .bad{color:var(--bad-red)}

/* Side panel */
.side{
  display:flex;
  flex-direction:column;
  gap:12px;
  min-width:0;
}
.panel{
  padding:18px 20px;
  border-radius:var(--radius-l);
  background:var(--bg-panel);
  border:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.panel-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;
}
.panel-step{
  width:34px;height:34px;
  border-radius:10px;
  background:var(--grad-action);
  color:#04222d;
  display:grid;place-items:center;
  font-size:15px;font-weight:1000;
}
.panel-title{
  margin:0;
  font-size:17px;font-weight:1000;
  letter-spacing:-.03em;line-height:1.2;
}
.panel-sub{
  margin:2px 0 0;
  font-size:12px;color:var(--text-muted);
  font-weight:700;
}
.panel-body{
  font-size:13.5px;
  color:var(--text);
  line-height:1.55;
}
.panel-body p{margin:0 0 10px}
.panel-body p:last-child{margin-bottom:0}
.hint{
  padding:11px 14px;
  border-radius:var(--radius-m);
  background:rgba(75,231,202,.08);
  border:1px solid rgba(75,231,202,.28);
  font-size:12.5px;font-weight:700;
  color:var(--text);
}
.hint b{color:var(--scan-cyan);font-weight:1000}
.hint.warn{
  background:rgba(255,209,102,.08);
  border-color:rgba(255,209,102,.32);
}
.hint.warn b{color:var(--warn-yellow)}

/* ============================================================
   STEP 1 - OPTIONS CARDS
   ============================================================ */
.opt-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.opt-card{
  padding:16px;
  border-radius:var(--radius-m);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  cursor:pointer;
  transition:all .2s ease;
  display:flex;
  flex-direction:column;
  gap:8px;
  text-align:left;
  position:relative;
}
.opt-card:hover{
  background:rgba(255,255,255,.08);
  border-color:var(--scan-cyan);
  transform:translateY(-2px);
}
.opt-card.intuition{
  background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(255,185,70,.10));
  border-color:var(--principle);
  box-shadow:0 0 0 1px var(--principle),0 14px 28px rgba(255,209,102,.22);
}
.opt-card .opt-icon{
  font-size:34px;
}
.opt-card .opt-name{
  font-size:15px;
  font-weight:1000;
  letter-spacing:-.02em;
}
.opt-card .opt-short{
  font-size:11.5px;
  color:var(--text-muted);
  font-weight:600;
  line-height:1.4;
}
.opt-card .intuition-badge{
  position:absolute;
  top:8px;right:8px;
  padding:3px 9px;
  border-radius:var(--radius-pill);
  background:var(--grad-principle);
  color:#3b2700;
  font-size:10px;font-weight:1000;
  letter-spacing:.06em;
}

/* Criteria preview */
.criteria-preview{
  margin-top:14px;
  padding:12px 14px;
  border-radius:var(--radius-m);
  background:rgba(94,195,255,.06);
  border:1px solid rgba(94,195,255,.22);
}
.criteria-preview .cp-title{
  font-size:11px;
  font-weight:900;
  color:var(--good-blue);
  letter-spacing:.08em;
  margin-bottom:8px;
  text-transform:uppercase;
}
.criteria-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.criteria-chip{
  padding:6px 11px;
  border-radius:var(--radius-pill);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  font-size:12px;
  font-weight:800;
  color:var(--text);
  display:flex;align-items:center;gap:4px;
}

/* ============================================================
   STEP 2 - WEIGHT SLIDERS
   ============================================================ */
.weight-section{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.weight-row{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:14px;
  align-items:center;
}
.weight-label{
  display:flex;align-items:center;gap:8px;
  min-width:130px;
  font-size:13px;font-weight:900;
}
.weight-label .wl-icon{font-size:18px}
.weight-slider{
  -webkit-appearance:none;appearance:none;
  width:100%;
  height:6px;
  border-radius:3px;
  background:rgba(255,255,255,.10);
  outline:none;
  cursor:pointer;
}
.weight-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--grad-action);
  cursor:grab;
  border:3px solid #061425;
  box-shadow:0 0 12px var(--scan-glow);
  transition:.15s;
}
.weight-slider::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.18)}
.weight-slider::-moz-range-thumb{
  width:22px;height:22px;
  border-radius:50%;
  background:var(--scan-cyan);
  cursor:grab;
  border:3px solid #061425;
}
.weight-value{
  min-width:48px;
  text-align:right;
  font-size:15px;font-weight:1000;
  color:var(--scan-cyan);
  font-variant-numeric:tabular-nums;
}
.weight-sum{
  margin-top:12px;
  padding:10px 14px;
  border-radius:var(--radius-pill);
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  text-align:center;
  font-size:13px;
  font-weight:800;
  color:var(--text-muted);
}
.weight-sum b{
  color:var(--solve-green);
  font-size:15px;
}

/* Preset buttons */
.preset-section{
  margin-top:14px;
}
.preset-title{
  font-size:11px;font-weight:900;
  color:var(--text-muted);
  letter-spacing:.1em;
  margin:0 0 8px;
  text-transform:uppercase;
}
.preset-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.preset-btn{
  padding:10px 8px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  color:var(--text-muted);
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}
.preset-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
.preset-btn.active{
  background:linear-gradient(135deg,rgba(75,231,202,.18),rgba(94,195,255,.14));
  border-color:var(--scan-cyan);
  color:var(--text);
}

/* ============================================================
   RANKING DISPLAY (Step 2, 4)
   ============================================================ */
.ranking-board{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100%;
  max-width:680px;
  margin:0 auto;
}
.rank-row{
  display:grid;
  grid-template-columns:54px 38px 1fr auto;
  gap:12px;
  align-items:center;
  padding:14px 16px;
  border-radius:var(--radius-m);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  transition:all .5s cubic-bezier(.2,.8,.3,1.2);
  position:relative;
  overflow:hidden;
}
.rank-row.rank-1{
  background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(255,185,70,.10));
  border-color:var(--principle);
  box-shadow:0 0 0 1px var(--principle),0 12px 28px rgba(255,209,102,.22);
}
.rank-row .rank-num{
  font-size:24px;
  font-weight:1000;
  text-align:center;
  font-variant-numeric:tabular-nums;
  color:var(--text-muted);
}
.rank-row.rank-1 .rank-num{
  color:var(--principle);
  font-size:28px;
  filter:drop-shadow(0 0 10px var(--principle-glow));
}
.rank-row .rank-icon{
  font-size:28px;
  text-align:center;
}
.rank-row .rank-name{
  font-size:14px;font-weight:1000;
  letter-spacing:-.02em;
}
.rank-row .rank-bar{
  margin-top:4px;
  height:6px;
  border-radius:3px;
  background:rgba(255,255,255,.06);
  overflow:hidden;
  position:relative;
}
.rank-row .rank-bar-fill{
  height:100%;
  background:var(--grad-action);
  border-radius:3px;
  transition:width .5s cubic-bezier(.2,.8,.3,1.2);
}
.rank-row.rank-1 .rank-bar-fill{background:var(--grad-principle)}
.rank-row .rank-score{
  font-size:18px;
  font-weight:1000;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  text-align:right;
  min-width:60px;
}
.rank-row.rank-1 .rank-score{color:var(--principle)}
.rank-row.intuition-mark::before{
  content:"내 직관";
  position:absolute;
  top:-1px;left:-1px;
  padding:3px 8px;
  border-radius:0 0 10px 0;
  background:var(--principle);
  color:#3b2700;
  font-size:10px;font-weight:1000;
  letter-spacing:.04em;
}
.rank-row.changed-up{
  animation:rankUp .6s cubic-bezier(.2,.8,.3,1.4);
}
.rank-row.changed-down{
  animation:rankDown .6s cubic-bezier(.2,.8,.3,1.4);
}
@keyframes rankUp{
  0%{transform:translateY(20px);opacity:0}
  100%{transform:translateY(0);opacity:1}
}
@keyframes rankDown{
  0%{transform:translateY(-20px);opacity:0}
  100%{transform:translateY(0);opacity:1}
}

/* Rank change notice */
.rank-notice{
  margin-top:14px;
  padding:12px 16px;
  border-radius:var(--radius-m);
  background:rgba(255,209,102,.12);
  border:1px solid var(--warn-yellow);
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  font-weight:800;
  animation:noticeIn .4s ease;
}
@keyframes noticeIn{
  from{opacity:0;transform:translateY(-6px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.rank-notice .rn-icon{font-size:22px}

/* ============================================================
   STEP 3 - SCORE MATRIX (compact, readable)
   ============================================================ */
.score-matrix{
  width:100%;
  max-width:760px;
  margin:0 auto;
  border-collapse:separate;
  border-spacing:0;
  font-size:12.5px;
}
.score-matrix th{
  padding:10px 8px;
  font-size:11.5px;font-weight:900;
  color:var(--text-muted);
  text-align:center;
  letter-spacing:.04em;
  border-bottom:1px solid var(--line);
}
.score-matrix th.opt-th{
  text-align:left;padding-left:14px;
}
.score-matrix td{
  padding:11px 8px;
  text-align:center;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.score-matrix tbody tr{
  border-radius:var(--radius-m);
  transition:.2s;
}
.score-matrix tbody tr:hover td{background:rgba(255,255,255,.04)}
.score-matrix td.opt-name{
  text-align:left;
  padding-left:14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;font-weight:1000;
  letter-spacing:-.02em;
}
.score-matrix td.opt-name .om-icon{font-size:18px}
.score-matrix td.score-cell{
  border-radius:8px;
}
.score-matrix .total-th{
  color:var(--principle);
}
.score-matrix td.total-cell{
  font-size:15px;
  color:var(--principle);
  font-weight:1000;
}
.score-matrix tbody tr.is-winner td{
  background:linear-gradient(90deg,rgba(255,209,102,.12),rgba(255,185,70,.06));
}
.score-cell .sc-bar{
  position:relative;
  display:inline-flex;
  width:100%;
  max-width:54px;
  height:18px;
  align-items:center;
  justify-content:center;
}
.score-cell .sc-bar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:6px;
  background:rgba(94,195,255,.10);
}
.score-cell .sc-bar .sc-fill{
  position:absolute;
  left:0;top:0;bottom:0;
  border-radius:6px;
  background:rgba(94,195,255,.32);
}
.score-cell .sc-bar .sc-text{
  position:relative;
  z-index:2;
  font-size:11.5px;
  font-weight:1000;
  color:var(--text);
}

/* Formula line */
.formula-box{
  margin-top:18px;
  padding:14px 18px;
  border-radius:var(--radius-m);
  background:linear-gradient(135deg,rgba(255,209,102,.10),rgba(255,185,70,.06));
  border:1px solid rgba(255,209,102,.32);
  text-align:center;
}
.formula-box .fb-label{
  font-size:11px;font-weight:900;
  color:var(--principle);
  letter-spacing:.08em;
  margin-bottom:8px;
  text-transform:uppercase;
}
.formula-box .fb-formula{
  font-size:14px;
  font-weight:1000;
  letter-spacing:-.02em;
  line-height:1.5;
}
.formula-box .fb-formula .x{color:var(--principle);margin:0 4px}
.formula-box .fb-example{
  margin-top:8px;
  font-size:12px;
  color:var(--text-muted);
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   STEP 5 - VERIFICATION SCANNER
   ============================================================ */
.verify-stage{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  max-width:760px;
  margin:0 auto;
}
.verify-winner{
  padding:18px 20px;
  border-radius:var(--radius-l);
  background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(255,185,70,.10));
  border:1px solid var(--principle);
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:14px;
  align-items:center;
}
.verify-winner .vw-icon{font-size:38px}
.verify-winner .vw-tag{
  display:inline-block;
  padding:3px 10px;
  border-radius:var(--radius-pill);
  background:rgba(255,209,102,.24);
  color:var(--principle);
  font-size:10px;font-weight:1000;
  letter-spacing:.08em;
  margin-bottom:4px;
}
.verify-winner .vw-name{
  font-size:18px;font-weight:1000;
  letter-spacing:-.02em;
}
.verify-winner .vw-score{
  font-size:22px;font-weight:1000;
  color:var(--principle);
  font-variant-numeric:tabular-nums;
}
.verify-checks{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.verify-item{
  padding:14px 16px;
  border-radius:var(--radius-m);
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:14px;
  align-items:center;
  transition:.2s;
}
.verify-item .vi-icon{
  width:36px;height:36px;
  border-radius:10px;
  background:rgba(94,195,255,.14);
  display:grid;place-items:center;
  font-size:18px;
}
.verify-item .vi-title{
  font-size:13px;font-weight:1000;
  letter-spacing:-.02em;
  margin-bottom:3px;
}
.verify-item .vi-q{
  font-size:12px;
  color:var(--text-muted);
  font-weight:700;
  line-height:1.4;
}
.verify-item .vi-buttons{
  display:flex;
  gap:6px;
}
.verify-item .vi-btn{
  padding:7px 11px;
  border:none;
  border-radius:10px;
  font-size:11.5px;
  font-weight:1000;
  cursor:pointer;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:var(--text-muted);
  transition:.15s;
}
.verify-item .vi-btn:hover{background:rgba(255,255,255,.10);color:var(--text)}
.verify-item.passed{
  background:linear-gradient(90deg,rgba(126,231,135,.10),rgba(75,231,202,.05));
  border-color:rgba(126,231,135,.36);
}
.verify-item.passed .vi-icon{background:rgba(126,231,135,.18);color:var(--solve-green)}
.verify-item.passed .vi-btn.pass{background:var(--solve-green);color:#04222d;border-color:transparent}
.verify-item.failed{
  background:linear-gradient(90deg,rgba(255,107,142,.10),rgba(255,107,142,.04));
  border-color:rgba(255,107,142,.42);
}
.verify-item.failed .vi-icon{background:rgba(255,107,142,.18);color:var(--bad-red)}
.verify-item.failed .vi-btn.fail{background:var(--bad-red);color:#fff;border-color:transparent}
.verify-item.warned{
  background:linear-gradient(90deg,rgba(255,209,102,.10),rgba(255,209,102,.04));
  border-color:rgba(255,209,102,.42);
}
.verify-item.warned .vi-icon{background:rgba(255,209,102,.18);color:var(--principle)}
.verify-item.warned .vi-btn.warn{background:var(--principle);color:#3b2700;border-color:transparent}

/* Verdict (final) */
.verdict{
  padding:22px 24px;
  border-radius:var(--radius-l);
  text-align:center;
  font-weight:1000;
  animation:verdictPop .55s cubic-bezier(.2,.8,.3,1.4);
}
@keyframes verdictPop{
  0%{opacity:0;transform:scale(.85)}
  60%{transform:scale(1.05)}
  100%{opacity:1;transform:scale(1)}
}
.verdict.pass{
  background:linear-gradient(135deg,rgba(126,231,135,.22),rgba(75,231,202,.12));
  border:2px solid var(--solve-green);
  box-shadow:0 18px 44px rgba(126,231,135,.22);
}
.verdict.fail{
  background:linear-gradient(135deg,rgba(255,107,142,.22),rgba(255,107,142,.10));
  border:2px solid var(--bad-red);
  box-shadow:0 18px 44px rgba(255,107,142,.22);
}
.verdict.warn{
  background:linear-gradient(135deg,rgba(255,209,102,.22),rgba(255,185,70,.10));
  border:2px solid var(--principle);
  box-shadow:0 18px 44px rgba(255,209,102,.22);
}
.verdict .v-icon{
  font-size:42px;margin-bottom:8px;
}
.verdict .v-title{
  font-size:22px;
  letter-spacing:-.03em;
  margin-bottom:6px;
}
.verdict.pass .v-title{color:var(--solve-green)}
.verdict.fail .v-title{color:var(--bad-red)}
.verdict.warn .v-title{color:var(--principle)}
.verdict .v-body{
  font-size:13.5px;
  color:var(--text-muted);
  font-weight:700;
  line-height:1.5;
  max-width:520px;
  margin:0 auto;
}

/* ============================================================
   NAV BAR
   ============================================================ */
.nav-bar{
  display:grid;
  grid-template-columns:auto auto 1fr auto auto;
  gap:10px;
  align-items:center;
  padding:14px 18px;
  border-radius:var(--radius-l);
  background:var(--bg-panel);
  border:1px solid var(--line);
  backdrop-filter:blur(14px);
  box-shadow:var(--shadow-soft);
}
.nav-btn{
  padding:13px 18px;
  border:none;
  border-radius:var(--radius-m);
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:var(--text);
  font-weight:1000;font-size:14px;
  cursor:pointer;
  transition:all .18s ease;
  display:flex;align-items:center;gap:8px;
  white-space:nowrap;
}
.nav-btn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.1);border-color:var(--line-strong)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{
  background:var(--grad-action);
  color:#04222d;
  border-color:transparent;
}
.nav-btn.primary:hover:not(:disabled){box-shadow:0 14px 28px rgba(75,231,202,.3)}
.nav-btn.ghost{
  background:transparent;
  color:var(--text-muted);
}
.nav-status{
  text-align:center;
  font-size:13px;
  color:var(--text-muted);
  font-weight:700;
}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti span{position:absolute;top:-10px;width:8px;height:14px;opacity:0;border-radius:2px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1100px){
  .step-pipe{gap:4px}
  .sp-node{padding:6px 8px;font-size:11px}
  .sp-node .sp-name{display:none}
}
@media (max-width: 960px){
  body{font-size:14px}
  #sim{padding:12px}
  .top-bar{grid-template-columns:auto 1fr;padding:12px 14px;gap:10px}
  .step-pipe{order:3;grid-column:1/-1;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}
  .step-pipe::-webkit-scrollbar{display:none}
  .case-picker{order:2;justify-self:end}
  .q-banner{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px}
  .q-constraint{align-self:flex-start;white-space:normal}
  .main-body{grid-template-columns:1fr}
  .scene{min-height:480px}
  .stage{inset:54px 16px 64px 16px}
  .scene-label{font-size:10px;left:50px}
  .scene-step-tag{right:50px;font-size:10px}
  .nav-bar{grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
  .nav-status{grid-column:1/-1;order:-1}
  .case-cards{grid-template-columns:1fr}
  .pipe-preview{grid-template-columns:repeat(5,1fr);gap:4px}
  .pipe-node{padding:8px 4px}
  .pipe-node::after{content:""}
  .pipe-node .pn-name{font-size:9.5px}
  .pipe-node .pn-num{width:22px;height:22px;font-size:10px;line-height:20px}
  .opt-grid{grid-template-columns:1fr}
  .weight-row{grid-template-columns:auto 1fr 50px;gap:8px}
  .weight-label{min-width:auto;font-size:12px}
  .preset-grid{grid-template-columns:1fr}
  .verify-item{grid-template-columns:auto 1fr;gap:10px}
  .verify-item .vi-buttons{grid-column:1/-1;justify-content:flex-end}
  .score-matrix{font-size:11px}
  .score-matrix th{padding:6px 4px;font-size:10px}
  .score-matrix td{padding:8px 4px}
  .score-matrix td.opt-name{font-size:11.5px;padding-left:6px;gap:4px}
  .score-matrix td.opt-name .om-icon{font-size:14px}
}
@media (max-width: 500px){
  .intro-title{font-size:36px}
  .verify-winner{grid-template-columns:auto 1fr;gap:10px}
  .verify-winner .vw-score{grid-column:2;text-align:right}
}
</style>
</head>
<body>

<!-- ============================================================
     INTRO SCREEN
     ============================================================ -->
<section id="intro" class="screen active">
  <div class="intro-wrap">
    <div class="intro-eyebrow">12주차 · 가중순위 의사결정 시뮬레이터</div>

    <h1 class="intro-title">아이디어 평가는<br>인기투표가 아니라 구조다</h1>
    <p class="intro-sub">
      <b>기준 · 가중치 · 점수 · 검증</b>의 5단계로 최적해를 도출합니다.<br>
      가중치가 바뀌면 1위가 달라지고, 1위라도 도덕성·안전성·환경성을 통과해야 합니다.
    </p>

    <div class="pipe-preview">
      <div class="pipe-node"><span class="pn-num">1</span><div class="pn-name">대안<br>확인</div></div>
      <div class="pipe-node"><span class="pn-num">2</span><div class="pn-name">가중치<br>조정</div></div>
      <div class="pipe-node"><span class="pn-num">3</span><div class="pn-name">점수<br>확인</div></div>
      <div class="pipe-node"><span class="pn-num">4</span><div class="pn-name">최종<br>순위</div></div>
      <div class="pipe-node"><span class="pn-num">5</span><div class="pn-name">최종<br>검증</div></div>
    </div>

    <p class="case-select-title">▸ 풀어볼 사례를 선택하세요</p>
    <div class="case-cards" id="caseCards"></div>

    <div class="intro-footer">BDU-X · 창의적 문제해결 · 12주차 1~2강</div>
  </div>
</section>

<!-- ============================================================
     MAIN SIM SCREEN
     ============================================================ -->
<section id="sim" class="screen">
  <div class="app">

    <!-- Top bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-text">의사결정 워크벤치</span>
      </div>
      <div class="step-pipe" id="stepPipe"></div>
      <div class="case-picker">
        <button class="case-pick-btn" id="casePickBtn" onclick="toggleCaseMenu()">
          <span id="casePickLabel">사례 선택</span>
        </button>
        <div class="case-menu" id="caseMenu"></div>
      </div>
    </header>

    <!-- Question banner -->
    <div class="q-banner">
      <span class="q-tag">현재 사례</span>
      <h2 class="q-text" id="qText"></h2>
      <span class="q-constraint" id="qConstraint"></span>
    </div>

    <!-- Main body -->
    <div class="main-body">
      <section class="scene" id="scene">
        <div class="scene-corner-tr"></div>
        <div class="scene-corner-bl"></div>
        <div class="scene-label" id="sceneLabel"></div>
        <div class="scene-step-tag" id="sceneStepTag"></div>
        <div class="stage" id="stage"></div>
        <div class="scene-caption" id="sceneCaption"></div>
      </section>

      <aside class="side">
        <div class="panel" id="sidePanel">
          <div class="panel-head">
            <div class="panel-step" id="panelStepNum">1</div>
            <div>
              <h3 class="panel-title" id="panelTitle"></h3>
              <p class="panel-sub" id="panelSub"></p>
            </div>
          </div>
          <div class="panel-body" id="panelBody"></div>
        </div>
      </aside>
    </div>

    <!-- Nav -->
    <footer class="nav-bar">
      <button class="nav-btn" id="prevBtn" onclick="prevStep()">◀ 이전</button>
      <button class="nav-btn ghost" onclick="restart()">처음으로</button>
      <div class="nav-status"><span id="navStatus">Step 1 / 5</span></div>
      <button class="nav-btn ghost" id="presetBtn" onclick="applyExamplePresets()">예시 적용</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextStep()">다음 ▶</button>

/* ============================================================
   STATE
   ============================================================ */
const state = {
  caseKey: "team",
  step: 0,              // 0..4 (Step 1..5)
  weights: {},          // current weights (raw, sum may differ)
  intuitionPick: null,  // user's gut choice (option id) - set in Step 1
  verifyResults: {},    // {checkId: 'pass'|'warn'|'fail'}
  currentWinner: null   // for change detection
};

const $ = (id) => document.getElementById(id);

/* ============================================================
   COMPUTATIONS
   ============================================================ */
function normalizedWeights(){
  const sum = Object.values(state.weights).reduce((a,b) => a+b, 0) || 1;
  const out = {};
  for(const [k, v] of Object.entries(state.weights)) out[k] = v / sum;
  return out;
}

function calcTotal(option){
  const nw = normalizedWeights();
  let total = 0;
  for(const [cid, w] of Object.entries(nw)){
    total += (option.scores[cid] || 0) * w;
  }
  return total;
}

function getRanked(){
  const c = CASES[state.caseKey];
  return c.options
    .map(o => ({ ...o, total: calcTotal(o) }))
    .sort((a, b) => b.total - a.total);
}

/* ============================================================
   INTRO RENDER
   ============================================================ */
function renderIntro(){
  const html = Object.entries(CASES).map(([key, c]) => `
    <button class="case-card" onclick="startCase('${key}')">
      <span class="cc-num">사례 ${c.num}</span>
      <div class="cc-icon">${c.icon}</div>
      <div class="cc-title">${c.label}</div>
      <div class="cc-sub">${c.title}</div>
      <div class="cc-tags">
        ${c.criteria.map(cr => `<span class="cc-tag">${cr.icon} ${cr.name}</span>`).join("")}
      </div>
    </button>
  `).join("");
  $("caseCards").innerHTML = html;
}

function startCase(key){
  state.caseKey = key;
  initCaseState();
  showScreen("sim");
  render();
}

function initCaseState(){
  const c = CASES[state.caseKey];
  state.step = 0;
  state.weights = { ...c.defaultWeights };
  state.intuitionPick = null;
  state.verifyResults = {};
  state.currentWinner = null;
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

function restart(){
  initCaseState();
  showScreen("intro");
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const c = CASES[state.caseKey];

  // top bar
  renderStepPipe();
  renderCaseMenu();
  $("casePickLabel").textContent = `사례 ${c.num} · ${c.label}`;

  // question banner
  $("qText").textContent = c.question;
  $("qConstraint").textContent = "📌 " + c.constraint;

  renderNav();
  renderScene();
  renderSide();
}

function renderStepPipe(){
  $("stepPipe").innerHTML = STEPS.map((s, i) => {
    const cls = i < state.step ? "done" : (i === state.step ? "active" : "");
    return `<button class="sp-node ${cls}" onclick="jumpStep(${i})">
      <span class="sp-num">${s.num}</span>
      <span class="sp-name">${s.title}</span>
    </button>`;
  }).join("");
}

function renderCaseMenu(){
  $("caseMenu").innerHTML = Object.entries(CASES).map(([key, c]) => `
    <button class="cm-item ${key === state.caseKey ? 'active' : ''}" onclick="switchCase('${key}')">
      ${c.icon} ${c.label}
      <small>${c.title}</small>
    </button>
  `).join("");
}

function toggleCaseMenu(){
  $("caseMenu").classList.toggle("show");
}

function switchCase(key){
  if(key === state.caseKey){
    $("caseMenu").classList.remove("show");
    return;
  }
  state.caseKey = key;
  initCaseState();
  $("caseMenu").classList.remove("show");
  render();
}

document.addEventListener("click", (e) => {
  if(!e.target.closest(".case-picker")) $("caseMenu").classList.remove("show");
});

function jumpStep(i){
  state.step = i;
  render();
}

function renderNav(){
  $("prevBtn").disabled = state.step === 0;
  $("nextBtn").textContent = state.step === 4 ? "처음으로 ↺" : "다음 ▶";
  $("navStatus").textContent = `Step ${state.step + 1} / 5`;
  const step = STEPS[state.step];
  $("sceneStepTag").textContent = `STEP ${state.step + 1}/5 · ${step.tag}`;
  $("sceneLabel").textContent = step.title;

  // 예시 적용 버튼: Step 2(가중치)에서만 의미있음
  $("presetBtn").style.display = (state.step === 1) ? "" : "none";

  // Step 5 검증: 모든 항목 응답 전엔 nextBtn 활성도 OK (그냥 처음으로로 이동)
}

function nextStep(){
  if(state.step < 4){
    state.step++;
    if(state.step === 3){ // Reached final ranking - confetti
      setTimeout(() => burstConfetti(28), 200);
    }
    render();
  } else {
    restart();
  }
}
function prevStep(){
  if(state.step > 0){
    state.step--;
    render();
  }
}

/* ============================================================
   SCENE RENDERING
   ============================================================ */
function renderScene(){
  const c = CASES[state.caseKey];
  const stage = $("stage");
  const caption = $("sceneCaption");

  switch(state.step){
    case 0: // Options
      stage.innerHTML = renderOptionsStage(c);
      caption.innerHTML = `<b>직관적으로 1위라고 생각하는 대안</b>을 골라 두세요 — 나중에 계산 결과와 비교합니다`;
      break;
    case 1: // Weights
      stage.innerHTML = renderWeightStage(c);
      caption.innerHTML = `가중치를 움직이면 <b>1위 후보가 바뀝니다</b> — 슬라이더로 직접 확인하세요`;
      break;
    case 2: // Scores
      stage.innerHTML = renderScoreStage(c);
      caption.innerHTML = `<b>기준 점수 × 가중치</b>를 모두 더해 최종 점수가 만들어집니다`;
      break;
    case 3: // Ranking
      stage.innerHTML = renderRankingStage(c);
      const ranked = getRanked();
      const intuitionMatch = state.intuitionPick && state.intuitionPick === ranked[0].id;
      caption.innerHTML = intuitionMatch
        ? `<b>직관과 계산 결과가 일치</b>합니다 — 단, 가중치를 바꾸면 다를 수 있습니다`
        : (state.intuitionPick
          ? `직관(<b>${c.options.find(o=>o.id===state.intuitionPick).name}</b>)과 계산 결과가 <b>다릅니다</b> — 왜일까요?`
          : `계산상 1위는 <b>${ranked[0].name}</b>입니다 — 가중치를 바꿔 보세요`);
      break;
    case 4: // Verify
      stage.innerHTML = renderVerifyStage(c);
      caption.innerHTML = `수학적 1등도 <b>도덕성·안전성·환경성</b> 검증을 통과해야 실행할 수 있습니다`;
      break;
  }
}

/* ============================================================
   SIDE PANEL RENDERING
   ============================================================ */
function renderSide(){
  const c = CASES[state.caseKey];
  const step = STEPS[state.step];
  $("panelStepNum").textContent = step.num;
  $("panelTitle").textContent = step.title;
  $("panelSub").textContent = step.sub;

  const body = $("panelBody");
  switch(state.step){
    case 0:
      body.innerHTML = renderOptionsPanel(c);
      break;
    case 1:
      body.innerHTML = renderWeightPanel(c);
      break;
    case 2:
      body.innerHTML = renderScorePanel(c);
      break;
    case 3:
      body.innerHTML = renderRankingPanel(c);
      break;
    case 4:
      body.innerHTML = renderVerifyPanel(c);
      break;
  }
}

/* ============================================================
   STEP 1 - OPTIONS
   ============================================================ */
function renderOptionsStage(c){
  return `
    <div class="opt-grid">
      ${c.options.map(o => `
        <button class="opt-card ${state.intuitionPick === o.id ? 'intuition' : ''}" onclick="pickIntuition('${o.id}')">
          ${state.intuitionPick === o.id ? '<span class="intuition-badge">내 직관 1위</span>' : ''}
          <div class="opt-icon">${o.icon}</div>
          <div class="opt-name">${o.name}</div>
          <div class="opt-short">${o.short}</div>
        </button>`).join("")}
    </div>
    <div class="criteria-preview" style="margin-top:18px">
      <p class="cp-title">▸ 이 사례의 평가 기준 ${c.criteria.length}개</p>
      <div class="criteria-chips">
        ${c.criteria.map(cr => `<span class="criteria-chip">${cr.icon} ${cr.name}</span>`).join("")}
      </div>
    </div>`;
}

function pickIntuition(id){
  state.intuitionPick = state.intuitionPick === id ? null : id;
  renderScene();
  renderSide();
}

function renderOptionsPanel(c){
  return `
    <p>이번 사례에서 평가할 대안 <b>${c.options.length}개</b>와 평가 기준 <b>${c.criteria.length}개</b>를 확인하세요.</p>
    <p style="margin-top:10px">왼쪽에서 <b style="color:var(--principle)">직관적으로 1위라고 생각하는 대안</b>을 골라 두면, 나중에 가중치 계산 결과와 비교할 수 있습니다.</p>
    <div class="hint warn" style="margin-top:14px"><b>다음 단계:</b> 평가 기준에 가중치를 부여해 우선순위를 정합니다.</div>`;

   STEP 2 - WEIGHTS
   ============================================================ */

  const c = CASES[state.caseKey];
  const ranked = getRanked();
  const max = ranked[0].total || 100;
  return ranked.map((o, i) => {
    const pct = (o.total / max) * 100;
    const isIntuition = state.intuitionPick === o.id;
    return `<div class="rank-row rank-${i+1} ${isIntuition ? 'intuition-mark' : ''}" data-id="${o.id}">
      <div class="rank-num">${i+1}</div>
      <div class="rank-icon">${o.icon}</div>
      <div>
        <div class="rank-name">${o.name}</div>
        <div class="rank-bar"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="rank-score">${o.total.toFixed(1)}</div>
    </div>`;
  }).join("");
}

function renderWeightPanel(c){
  const sum = Object.values(state.weights).reduce((a,b) => a+b, 0);
  return `
    <div class="weight-section">
      ${c.criteria.map(cr => {
        const v = state.weights[cr.id] || 0;
        return `<div class="weight-row">
          <div class="weight-label"><span class="wl-icon">${cr.icon}</span>${cr.name}</div>
          <input type="range" min="0" max="100" value="${v}" class="weight-slider"
            oninput="setWeight('${cr.id}', this.value)" />
          <div class="weight-value">${v}</div>
        </div>`;
      }).join("")}
    </div>
    <div class="weight-sum">가중치 합 <b>${sum}</b> · 자동으로 비율로 환산됩니다</div>
    <div class="preset-section">
      <p class="preset-title">▸ 빠른 프리셋</p>
      <div class="preset-grid">
        ${c.presets.map((p, i) => `
          <button class="preset-btn ${isActivePreset(c, p) ? 'active' : ''}" onclick="applyPreset(${i})">
            ${p.label}
          </button>`).join("")}
      </div>
    </div>
    <div class="hint" style="margin-top:14px"><b>핵심:</b> 슬라이더를 움직이면 왼쪽 순위가 즉시 바뀝니다. 1위가 바뀌면 알림이 뜹니다.</div>`;
}

function isActivePreset(c, preset){
  return c.criteria.every(cr => state.weights[cr.id] === preset.weights[cr.id]);
}

function setWeight(critId, value){
  const newWinner = getRanked()[0].id;
  state.weights[critId] = parseInt(value, 10);
  // detect winner change
  const nextWinner = getRanked()[0].id;
  updateLiveRanking(newWinner !== nextWinner ? nextWinner : null);

  // update slider value display next to it
  const sliders = document.querySelectorAll('.weight-slider');
  sliders.forEach(s => {
    if(s.getAttribute('oninput').includes(`'${critId}'`)){
      s.parentElement.querySelector('.weight-value').textContent = value;
    }
  });
  // update sum
  const sum = Object.values(state.weights).reduce((a,b) => a+b, 0);
  document.querySelector('.weight-sum').innerHTML = `가중치 합 <b>${sum}</b> · 자동으로 비율로 환산됩니다`;
  // update active preset
  const c = CASES[state.caseKey];
  document.querySelectorAll('.preset-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', isActivePreset(c, c.presets[idx]));
  });
}

function updateLiveRanking(newWinnerId){
  const board = $("liveRanking");
  if(!board) return;
  board.innerHTML = renderRankingRows();
  if(newWinnerId){
    showRankNotice(newWinnerId);
    burstConfetti(20);
  }
}

function showRankNotice(winnerId){
  const c = CASES[state.caseKey];
  const winner = c.options.find(o => o.id === winnerId);
  // Inject notice into stage temporarily
  const board = $("liveRanking");
  if(!board) return;
  const existing = board.querySelector('.rank-notice');
  if(existing) existing.remove();
  const notice = document.createElement('div');
  notice.className = 'rank-notice';
  notice.innerHTML = `<span class="rn-icon">🎯</span><span><b>1위가 변경되었습니다!</b> 새 1위: ${winner.icon} <b style="color:var(--warn-yellow)">${winner.name}</b></span>`;
  board.prepend(notice);
  setTimeout(() => notice.remove(), 3000);
}

function applyPreset(idx){
  const c = CASES[state.caseKey];
  const preset = c.presets[idx];
  const prevWinner = getRanked()[0].id;
  state.weights = { ...preset.weights };
  const newWinner = getRanked()[0].id;
  renderSide();
  updateLiveRanking(prevWinner !== newWinner ? newWinner : null);
}

function applyExamplePresets(){
  // "예시 적용" - 첫 번째 프리셋 (특성 중심) 적용
  applyPreset(0);
}

/* ============================================================
   STEP 3 - SCORES
   ============================================================ */
function renderScoreStage(c){
  const ranked = getRanked();
  const winner = ranked[0];
  const nw = normalizedWeights();

  // Build sample calculation string for winner
  const calcParts = c.criteria.map(cr => {
    const score = winner.scores[cr.id];
    const w = nw[cr.id];
    return `${score}×${(w*100).toFixed(0)}%`;
  }).join(" + ");
  const total = winner.total.toFixed(1);

  return `
    <table class="score-matrix">
      <thead>
        <tr>
          <th class="opt-th">대안</th>
          ${c.criteria.map(cr => `<th>${cr.icon}<br>${cr.name}<br><span style="font-size:10px;color:var(--principle)">${(nw[cr.id]*100).toFixed(0)}%</span></th>`).join("")}
          <th class="total-th">총점</th>
        </tr>
      </thead>
      <tbody>
        ${ranked.map(o => `
          <tr class="${o.id === winner.id ? 'is-winner' : ''}">
            <td class="opt-name"><span class="om-icon">${o.icon}</span>${o.name}</td>
            ${c.criteria.map(cr => {
              const s = o.scores[cr.id];
              return `<td class="score-cell">
                <span class="sc-bar">
                  <span class="sc-fill" style="width:${s}%"></span>
                  <span class="sc-text">${s}</span>
                </span>
              </td>`;
            }).join("")}
            <td class="total-cell">${o.total.toFixed(1)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
    <div class="formula-box">
      <div class="fb-label">▸ 가중 점수 계산 방식</div>
      <div class="fb-formula">최종점수 = ${c.criteria.map(cr => `(${cr.name}점수 <span class="x">×</span> ${cr.name}가중치)`).join(" + ")}</div>
      <div class="fb-example">예시 (1위 · ${winner.name}): ${calcParts} = <b style="color:var(--principle)">${total}</b>점</div>
    </div>`;
}

function renderScorePanel(c){
  const ranked = getRanked();
  const winner = ranked[0];
  return `
    <p>각 대안의 기준별 점수 (0~100점)와 정규화된 가중치(%)가 표시됩니다.</p>
    <p style="margin-top:10px">예를 들어 <b>${winner.name}</b>은 ${c.criteria.map(cr => `${cr.name} ${winner.scores[cr.id]}점`).join(", ")}으로 평가되었습니다.</p>
    <div class="hint" style="margin-top:14px"><b>핵심:</b> 점수가 같더라도 가중치가 다르면 총점이 달라집니다.</div>`;
}

/* ============================================================
   STEP 4 - FINAL RANKING
   ============================================================ */
function renderRankingStage(c){
  return `<div class="ranking-board">${renderRankingRows()}</div>`;
}

function renderRankingPanel(c){
  const ranked = getRanked();
  const winner = ranked[0];
  const intuition = state.intuitionPick ? c.options.find(o => o.id === state.intuitionPick) : null;
  const match = intuition && intuition.id === winner.id;

  return `
    <p><b style="color:var(--principle)">🥇 1위: ${winner.icon} ${winner.name}</b> (${winner.total.toFixed(1)}점)</p>
    ${intuition ? `
      <p style="margin-top:10px">내 직관 선택: <b>${intuition.icon} ${intuition.name}</b></p>
      <div class="hint ${match ? '' : 'warn'}" style="margin-top:8px">
        ${match
          ? `<b>일치!</b> 직관이 계산 결과와 같습니다. 단, 가중치를 바꾸면 결과가 달라질 수 있다는 점을 기억하세요.`
          : `<b>불일치!</b> 직관과 계산 결과가 다릅니다. 가중치 조정이 결과를 바꿨거나, 직관이 특정 기준에 치우쳐 있었을 수 있습니다.`}
      </div>
    ` : ''}
    <div class="hint" style="margin-top:14px"><b>다음 단계:</b> 수학적 1위라도 도덕성·안전성·환경성 검증을 통과해야 실행할 수 있습니다.</div>`;
}

/* ============================================================
   STEP 5 - VERIFICATION
   ============================================================ */
function renderVerifyStage(c){
  const ranked = getRanked();
  const winner = ranked[0];
  const checks = c.verify.checks;

  const allAnswered = checks.every(ch => state.verifyResults[ch.id]);
  const verdict = allAnswered ? computeVerdict(c) : null;

  return `
    <div class="verify-stage">
      <div class="verify-winner">
        <div class="vw-icon">${winner.icon}</div>
        <div>
          <span class="vw-tag">계산상 1위</span>
          <div class="vw-name">${winner.name}</div>
        </div>
        <div class="vw-score">${winner.total.toFixed(1)}</div>
      </div>
      <div class="verify-checks">
        ${checks.map(ch => {
          const res = state.verifyResults[ch.id];
          const cls = res === 'pass' ? 'passed' : (res === 'fail' ? 'failed' : (res === 'warn' ? 'warned' : ''));
          return `<div class="verify-item ${cls}">
            <div class="vi-icon">${vIcon(ch.id)}</div>
            <div>
              <div class="vi-title">${ch.title}</div>
              <div class="vi-q">${ch.q}</div>
            </div>
            <div class="vi-buttons">
              <button class="vi-btn pass" onclick="verifyItem('${ch.id}', 'pass')">통과</button>
              <button class="vi-btn warn" onclick="verifyItem('${ch.id}', 'warn')">주의</button>
              <button class="vi-btn fail" onclick="verifyItem('${ch.id}', 'fail')">실패</button>
            </div>
          </div>`;
        }).join("")}
      </div>
      ${verdict ? renderVerdict(verdict, c, winner) : ''}
    </div>`;
}

function vIcon(id){
  return { ethics:"⚖️", bigpicture:"🌏", safety:"🛡️", environment:"🌱", law:"📜" }[id] || "📋";
}

function verifyItem(checkId, result){
  state.verifyResults[checkId] = result;
  renderScene();
  renderSide();
  // 모두 응답하면 검증 결과에 따라 콘페티 또는 알림
  const c = CASES[state.caseKey];
  if(c.verify.checks.every(ch => state.verifyResults[ch.id])){
    const verdict = computeVerdict(c);
    if(verdict.tone === 'pass') setTimeout(() => burstConfetti(40), 200);
    // verdict가 보이도록 stage를 부드럽게 아래로 스크롤
    setTimeout(() => {
      const stage = $("stage");
      if(stage){
        stage.scrollTo({ top: stage.scrollHeight, behavior: 'smooth' });
      }
    }, 100);
  }
}

function computeVerdict(c){
  const results = Object.values(state.verifyResults);
  const hasFail = results.includes('fail');
  const hasWarn = results.includes('warn');

  if(hasFail){
    return {
      tone:"fail", icon:"🚫", title:"1위 기각 · 차순위 검토 필요",
      body:"검증에서 통과하지 못한 항목이 있습니다. 수학적 1위라도 도덕성·안전성·환경성에 문제가 있다면 실행할 수 없습니다. 차순위 대안을 다시 검토해야 합니다."
    };
  }
  if(hasWarn) return c.verify.verdict.someWarn;
  return c.verify.verdict.allPass;
}

function renderVerdict(verdict, c, winner){
  let next = '';
  if(verdict.tone === 'fail'){
    const ranked = getRanked();
    if(ranked[1]){
      next = `<div style="margin-top:12px;font-size:13px;color:var(--text);font-weight:800">▸ 차순위 검토 후보: <b style="color:var(--warn-yellow)">${ranked[1].icon} ${ranked[1].name}</b> (${ranked[1].total.toFixed(1)}점)</div>`;
    }
  }
  return `<div class="verdict ${verdict.tone}">
    <div class="v-icon">${verdict.icon}</div>
    <div class="v-title">${verdict.title}</div>
    <div class="v-body">${verdict.body}</div>
    ${next}
  </div>`;
}

function renderVerifyPanel(c){
  const checks = c.verify.checks;
  const answered = checks.filter(ch => state.verifyResults[ch.id]).length;
  const total = checks.length;

  return `
    <p>1위 후보가 정말 실행할 수 있는 아이디어인지 <b>5개 영역</b>에서 검증합니다.</p>
    <p style="margin-top:10px;font-size:13px;color:var(--text-muted)">진행: <b style="color:var(--scan-cyan)">${answered}</b> / ${total} 응답</p>
    ${answered === total ? `
      <div class="hint" style="margin-top:14px"><b>완료!</b> 모든 항목에 응답했습니다. 왼쪽에서 최종 결과를 확인하세요.</div>
    ` : `
      <div class="hint warn" style="margin-top:14px"><b>안내:</b> 각 항목에 <b>통과 / 주의 / 실패</b> 중 하나를 선택하세요. 하나라도 실패면 1위가 기각됩니다.</div>
    `}
    <p style="margin-top:14px;font-size:12px;color:var(--text-dim);line-height:1.5">
      💡 이 시뮬레이터의 검증 결과는 강의 사례 기준이며, 학습자가 자신의 가치 기준으로 직접 답해도 됩니다.
    </p>`;
}

/* ============================================================
   CONFETTI
   ============================================================ */
function burstConfetti(count = 32){
  const c = $("confetti");
  const colors = ["#4be7ca","#5ec3ff","#ffd166","#ff6b8e","#b794f6","#7ee787"];
  for(let i = 0; i < count; i++){
    const s = document.createElement("span");
    s.style.left = Math.random() * 100 + "%";
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.animation = `confetti-fall ${1.6 + Math.random()*1.2}s ease-in ${Math.random()*0.3}s forwards`;
    s.style.transform = `rotate(${Math.random()*360}deg)`;
    c.appendChild(s);
    setTimeout(() => s.remove(), 3500);
  }
}

const cstyle = document.createElement("style");
cstyle.textContent = `
@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
}`;
document.head.appendChild(cstyle);

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener("keydown", (e) => {
  if(!$("sim").classList.contains("active")) return;
  if(e.key === "ArrowRight") nextStep();
  if(e.key === "ArrowLeft") prevStep();
});

/* ============================================================
   INIT
   ============================================================ */
renderIntro();
</script>

</body>
</html>
